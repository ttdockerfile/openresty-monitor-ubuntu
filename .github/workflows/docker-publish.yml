name: Docker Publish

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: "buyfakett/openresty"
  IMAGE_TAG: "1.31.9.1-vts_0.2.7-ngx_waf_10.1.2-acme_0.4.2"

jobs:
  build-amd64:
    name: Build linux/amd64
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Verify native amd64 runner
        run: test "$(dpkg --print-architecture)" = "amd64"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push amd64 image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=openresty-amd64
          cache-to: type=gha,mode=max,scope=openresty-amd64,ignore-error=true

  build-arm64:
    name: Build linux/arm64
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Verify native arm64 runner
        run: test "$(dpkg --print-architecture)" = "arm64"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push arm64 image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=openresty-arm64
          cache-to: type=gha,mode=max,scope=openresty-arm64,ignore-error=true

  merge:
    name: Publish multi-platform tag
    runs-on: ubuntu-24.04
    needs:
      - build-amd64
      - build-arm64
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-platform tag
        env:
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        run: |
          set -euo pipefail

          [[ "${AMD64_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${ARM64_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]

          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${IMAGE_NAME}@${AMD64_DIGEST}" \
            "${IMAGE_NAME}@${ARM64_DIGEST}"

      - name: Verify multi-platform image
        run: |
          set -euo pipefail

          image="${IMAGE_NAME}:${IMAGE_TAG}"
          docker buildx imagetools inspect "${image}"
          docker buildx imagetools inspect --raw "${image}" \
            | jq -e '
                any(.manifests[]?.platform; .os == "linux" and .architecture == "amd64")
                and any(.manifests[]?.platform; .os == "linux" and .architecture == "arm64")
              ' >/dev/null
